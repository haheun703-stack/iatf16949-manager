<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>M1 목업 — 현장 원버튼(태블릿)</title>
<style>
  * { margin:0; box-sizing:border-box; font-family:'Malgun Gothic','Segoe UI',sans-serif; }
  body { width:800px; height:1280px; background:#f4f7fb; color:#1a2b45; display:flex; flex-direction:column; }
  .top { background:#fff; border-bottom:1px solid #dde5f0; padding:18px 24px; display:flex; align-items:center; gap:12px; }
  .logo { width:34px; height:34px; border-radius:9px; background:#e3edfb; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .top b { font-size:19px; } .top .sub { font-size:13px; color:#6b7c99; }
  .user { margin-left:auto; background:#eef4fd; border:1px solid #cfdef5; border-radius:999px; padding:8px 16px; font-size:15px; font-weight:700; color:#2456a6; }
  .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; padding:32px; }
  .big { width:640px; height:560px; border:none; border-radius:36px; background:linear-gradient(180deg,#3372df,#2456a6);
         color:#fff; font-size:44px; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
         box-shadow:0 18px 40px rgba(36,86,166,.28); }
  .big .cam { font-size:110px; }
  .hint { font-size:19px; color:#54678a; text-align:center; line-height:1.7; }
  .toast { background:#e7f6ec; border:1.5px solid #9fd8b1; color:#1c7a3d; border-radius:14px; padding:16px 28px; font-size:22px; font-weight:800; }
  .today { width:640px; background:#fff; border:1px solid #dde5f0; border-radius:18px; padding:18px 22px; }
  .today .t { font-size:15px; font-weight:700; color:#54678a; margin-bottom:12px; }
  .row { display:flex; gap:12px; }
  .ph { width:118px; height:88px; border-radius:10px; background:repeating-linear-gradient(45deg,#e8eef7,#e8eef7 8px,#dbe5f2 8px,#dbe5f2 16px); border:1px solid #cfdaea; position:relative; }
  .ph em { position:absolute; left:6px; bottom:5px; font-style:normal; font-size:11.5px; background:rgba(26,43,69,.72); color:#fff; border-radius:5px; padding:1px 6px; }
  .foot { padding:14px 24px 22px; text-align:center; font-size:13.5px; color:#8494ad; }
</style></head><body>
  <div class="top">
    <div class="logo">📋</div>
    <div><b>입고 사진함</b><div class="sub">주식회사 티피씨 · 자재 입고 증거</div></div>
    <div class="user">👤 조성민 · 영업/자재팀</div>
  </div>
  <div class="main">
    <button class="big"><span class="cam">📷</span>입고 사진 찍기</button>
    <div class="toast">✓ 올라갔습니다 (오늘 3장째) — 14:22</div>
    <div class="today">
      <div class="t">오늘 올린 입고 사진 · 3장 (자동 기록: 시각 · 찍은 사람 · '입고')</div>
      <div class="row">
        <div class="ph"><em>14:22</em></div>
        <div class="ph"><em>11:05</em></div>
        <div class="ph"><em>09:31</em></div>
      </div>
    </div>
    <div class="hint">자재가 들어오면 <b>버튼 한 번 → 거래명세서/밀시트 촬영</b> — 끝.<br>
    고르거나 입력할 것 없음 · 품번 정리는 사무실이 합니다</div>
  </div>
  <div class="foot">15번 §0.5-2 원버튼 사진함 목업 · 현장 입력 0개 · 태블릿=크롬만(설치 0)</div>
</body></html>

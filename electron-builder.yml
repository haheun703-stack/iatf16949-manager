appId: com.iatf16949.qms-manager
productName: IATF16949 품질경영시스템
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - resources/**/*
  - "!resources/seed/**"

extraResources:
  - from: resources/migrations
    to: migrations
  - from: resources/seed
    to: seed
  # ⚠️ 보안: .env(API 키)는 절대 번들 금지 — 설치판이 곧 유출 패키지가 된다(제품화 감사 7/6).
  # AI 키는 사용자 PC의 userData/.env 에서 읽음(env-loader 1순위). 인스톨러에 미포함.
  # 양식 출력엔진 마스터 원본(있을 때만 번들). 배포 시 원본 72양식을 resources/forms 에 복사.
  # 엔진은 process.resourcesPath/forms 를 자동 탐색(form-export-engine.ts resolveMastersDir).
  - from: resources/forms
    to: forms
    filter:
      - "**/*.xlsx"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IATF16949 QMS

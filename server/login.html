<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 — 데일리Q</title>
    <!--
      로그인 파티클 배경 (시각 정본 = 18_로그인_파티클_데모_v3_260726.html, 사장님 확정 7/26)
      · 점들이 화면 전체를 드리프트 — 클릭 시 회사명으로 모임 / 재클릭 시 흩어짐 (자동 모임 없음)
      · 색 = 파스텔 블루 주조 + 흰 + 연핑크 + 라벤더 (COLORS 가중치 v3 그대로, 원색·자홍 금지)
      · 저사양 = 파티클 수 자동 축소(면적·DPR 기준) · prefers-reduced-motion = 정적 배경
      · 제품명 = 데일리Q (판매 제품명, 사장님 결정 7/26).
      · 회사명 = DB(company_profile.companyName) 유래 — GET /api/brand (39호 S1, 하드코딩 제거).
        미설정/실패 시 제품명 '데일리Q' 폴백.
    -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: #0b0f1a;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      }
      canvas { display: block; position: absolute; inset: 0; }
      .hint {
        position: absolute; bottom: 22px; width: 100%; text-align: center;
        color: #4a5468; font-size: 12.5px; pointer-events: none;
      }
      .login {
        position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
        width: min(340px, 92vw); background: rgba(17, 23, 38, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
        padding: 26px 26px 20px; backdrop-filter: blur(10px); color: #e7eaf0;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .login p.brand {
        font-size: 12.5px; color: #8a93a2; margin: 0 0 16px; text-align: center; letter-spacing: 0.01em;
      }
      .login p.brand b { color: #cbd6ea; font-size: 14px; }
      .login input {
        width: 100%; box-sizing: border-box; background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 10px;
        padding: 12px 13px; color: #fff; font-size: 14px; margin-bottom: 10px; outline: none;
      }
      .login input:focus { border-color: #5b8def; }
      .login input::placeholder { color: #6b7280; }
      .login button {
        width: 100%; background: #2563eb; border: 0; border-radius: 10px; padding: 12.5px;
        color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px;
      }
      .login button:hover { background: #1d4fc7; }
      .login button:disabled { opacity: 0.6; cursor: default; }
      .err { margin-top: 12px; font-size: 12.5px; color: #f87171; font-weight: 600; min-height: 17px; text-align: center; }
      .foot { margin-top: 10px; font-size: 11px; color: #6b7280; text-align: center; line-height: 1.6; }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <form class="login" id="f" autocomplete="off">
      <p class="brand"><b>데일리Q</b> &nbsp;·&nbsp; 품질 · 업무 관리 시스템</p>
      <input id="name" name="name" type="text" placeholder="이름" autofocus />
      <input id="pw" name="pw" type="password" placeholder="비밀번호" />
      <button type="submit" id="btn">로그인</button>
      <div class="err" id="err"></div>
      <div class="foot">사내망 전용 · 세션은 4시간 유휴 후 만료됩니다.</div>
    </form>
    <div class="hint" id="hint">화면을 클릭하면 회사 이름이 모입니다</div>

    <script>
      // ── 인증 (기존 로직 무변) ─────────────────────────────
      const f = document.getElementById('f')
      const err = document.getElementById('err')
      const btn = document.getElementById('btn')
      f.addEventListener('submit', async (e) => {
        e.preventDefault()
        err.textContent = ''
        btn.disabled = true
        try {
          const r = await fetch('/api/auth:login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: document.getElementById('name').value.trim(), password: document.getElementById('pw').value })
          })
          const j = await r.json()
          if (r.ok && j.success) {
            location.href = '/'
          } else {
            err.textContent = j.error || '로그인에 실패했습니다.'
            btn.disabled = false
          }
        } catch (e) {
          err.textContent = '서버에 연결할 수 없습니다.'
          btn.disabled = false
        }
      })

      // ── 파티클 배경 (v3 정본 이식) ────────────────────────
      // 회사명 = /api/brand(company_profile) 유래(39호 S1). 도착 전엔 타깃 0개 = 클릭 무동작(수 ms 창).
      // 미설정/실패 폴백 = 제품명 '데일리Q'(중립) — 시각 데모는 항상 성립.
      let COMPANY = ''
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
      const cv = document.getElementById('cv')
      if (reduced) {
        cv.style.display = 'none' // 정적 배경 — 애니메이션 전체 생략
        document.getElementById('hint').style.display = 'none'
      } else {
        const x = cv.getContext('2d')
        let W, H, pts = [], targets = [], mode = 'drift'
        const COLORS = [
          { c: '#7FA8F5', w: 30 }, { c: '#A5C4FA', w: 22 }, { c: '#5B8DEF', w: 14 },
          { c: '#E8EEF8', w: 16 }, { c: '#F3B8D8', w: 11 }, { c: '#B9B4F2', w: 7 }
        ]
        const pick = () => {
          let r = Math.random() * 100
          for (const k of COLORS) { if ((r -= k.w) < 0) return k.c }
          return COLORS[0].c
        }
        function makeTargets() {
          const off = document.createElement('canvas')
          off.width = W; off.height = H
          const o = off.getContext('2d')
          const fs = Math.min(W * 0.12, 185)
          o.font = '500 ' + fs + 'px Pretendard, sans-serif'
          o.textAlign = 'center'; o.textBaseline = 'middle'
          o.fillText(COMPANY, W / 2, H * 0.26)
          const d = o.getImageData(0, 0, W, H).data
          targets = []
          const gap = Math.max(3, Math.round(fs / 34))
          for (let yy = 0; yy < H; yy += gap)
            for (let xx = 0; xx < W; xx += gap)
              if (d[(yy * W + xx) * 4 + 3] > 128) targets.push({ x: xx, y: yy })
        }
        function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; makeTargets() }
        function init() {
          pts = []
          // 저사양 자동 축소: 면적 + devicePixelRatio 기준(고DPI 소형 기기 과부하 방지)
          const scale = Math.min(1, 1.6 / Math.max(1, devicePixelRatio))
          const n = Math.round(Math.min(1600, Math.max(500, (W * H) / 1200)) * scale)
          for (let i = 0; i < n; i++)
            pts.push({
              x: Math.random() * W, y: Math.random() * H,
              vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
              r: 1.7 + Math.random() * 2.0, c: pick(), tx: 0, ty: 0
            })
        }
        function assign() {
          if (targets.length === 0) return // 회사명 미도착(fetch 전) — 클릭 무동작
          const sh = [...targets].sort(() => Math.random() - 0.5)
          pts.forEach((p, i) => {
            const t = sh[i % sh.length]
            p.tx = t.x + (Math.random() - 0.5) * 1.6
            p.ty = t.y + (Math.random() - 0.5) * 1.6
          })
        }
        function tick() {
          x.clearRect(0, 0, W, H)
          x.strokeStyle = 'rgba(255,255,255,.022)'; x.lineWidth = 1
          for (let g = 0; g < W; g += 64) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, H); x.stroke() }
          for (let g = 0; g < H; g += 64) { x.beginPath(); x.moveTo(0, g); x.lineTo(W, g); x.stroke() }
          for (const p of pts) {
            if (mode === 'form') { p.x += (p.tx - p.x) * 0.07; p.y += (p.ty - p.y) * 0.07 }
            else { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1 }
            const g = x.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.1, p.x, p.y, p.r)
            g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.3, p.c); g.addColorStop(1, p.c + 'CC')
            x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill()
          }
          requestAnimationFrame(tick)
        }
        addEventListener('click', (e) => {
          if (e.target.closest('.login')) return
          if (mode === 'drift') {
            assign(); mode = 'form'
            document.getElementById('hint').textContent = '한 번 더 클릭하면 흩어집니다'
          } else {
            mode = 'drift'
            for (const p of pts) { p.vx = (Math.random() - 0.5) * 1.5; p.vy = (Math.random() - 0.5) * 1.5 }
            document.getElementById('hint').textContent = '화면을 클릭하면 회사 이름이 모입니다'
          }
        })
        addEventListener('resize', () => { resize(); })
        resize(); init(); tick()
        // 회사명 로드(무인증 /api/brand) — 도착 후 타깃 재생성. 실패/공백 = '데일리Q' 폴백.
        fetch('/api/brand')
          .then((r) => r.json())
          .then((j) => { COMPANY = ((j && j.companyName) || '').trim() || '데일리Q'; makeTargets() })
          .catch(() => { COMPANY = '데일리Q'; makeTargets() })
      }
    </script>
  </body>
</html>

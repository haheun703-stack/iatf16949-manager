<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 — IATF 16949 품질경영시스템</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-deep: #1d4ed8;
        --bg: #eef2fb;
        --card: #ffffff;
        --border: #dbe2f1;
        --text: #1e293b;
        --muted: #64748b;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #eef2fb 0%, #e0e8f7 100%);
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
        color: var(--text);
      }
      .card {
        width: min(400px, 92vw); background: var(--card); border: 1px solid var(--border);
        border-radius: 16px; box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12); padding: 36px 32px;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .brand .logo {
        width: 44px; height: 44px; border-radius: 11px; background: var(--primary);
        color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
      }
      .brand .co { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
      .brand .sys { font-size: 12px; color: var(--muted); }
      h1 { font-size: 21px; font-weight: 800; margin: 22px 0 4px; letter-spacing: -0.02em; }
      .sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
      label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
      input {
        width: 100%; height: 46px; padding: 0 14px; font-size: 14.5px; border: 1px solid var(--border);
        border-radius: 10px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
      button {
        width: 100%; height: 48px; margin-top: 24px; font-size: 15px; font-weight: 800; color: #fff;
        background: var(--primary); border: none; border-radius: 10px; cursor: pointer; transition: background .15s;
      }
      button:hover { background: var(--primary-deep); }
      button:disabled { opacity: .6; cursor: default; }
      .err { margin-top: 14px; font-size: 13px; color: var(--danger); font-weight: 600; min-height: 18px; }
      .foot { margin-top: 20px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <form class="card" id="f" autocomplete="off">
      <div class="brand">
        <div class="logo">Q</div>
        <div>
          <div class="co">주식회사 티피씨</div>
          <div class="sys">IATF 16949 품질경영시스템</div>
        </div>
      </div>
      <h1>로그인</h1>
      <div class="sub">아이디(이름)와 비밀번호로 접속하세요.</div>
      <label for="name">이름</label>
      <input id="name" name="name" type="text" placeholder="예: 류형석" autofocus />
      <label for="pw">비밀번호</label>
      <input id="pw" name="pw" type="password" placeholder="비밀번호" />
      <button type="submit" id="btn">로그인</button>
      <div class="err" id="err"></div>
      <div class="foot">사내망 전용 · 세션은 4시간 유휴 후 만료됩니다.</div>
    </form>
    <script>
      const f = document.getElementById('f')
      const err = document.getElementById('err')
      const btn = document.getElementById('btn')
      f.addEventListener('submit', async (e) => {
        e.preventDefault()
        err.textContent = ''
        btn.disabled = true
        try {
          const r = await fetch('/api/auth:login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: document.getElementById('name').value.trim(), password: document.getElementById('pw').value })
          })
          const j = await r.json()
          if (r.ok && j.success) {
            location.href = '/'
          } else {
            err.textContent = j.error || '로그인에 실패했습니다.'
            btn.disabled = false
          }
        } catch (e) {
          err.textContent = '서버에 연결할 수 없습니다.'
          btn.disabled = false
        }
      })
    </script>
  </body>
</html>

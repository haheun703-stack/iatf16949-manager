<!--
  데일리Q 앱 아이콘 — 작은 크기 판 (16 · 24 · 32 px 용)

  큰 판(icon.svg)을 16px 로 줄이면 눈금 3개와 얇은 바늘이 뭉쳐 회색 덩어리가 된다.
  그래서 작은 치수는 이 파일로 따로 굽는다(mark-simple 기하 + 더 큰 배치).
    · 눈금 없음 · 선 굵음 · 마크가 캔버스의 약 59%(큰 판 52%보다 크게)
  ICO 안에 두 판이 함께 들어가므로, 윈도우가 치수에 맞는 쪽을 골라 쓴다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3560"/>
      <stop offset="1" stop-color="#0F1E38"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <g transform="translate(45.4, 45.4) scale(4.2)" fill="none" stroke-linecap="round">
    <g transform="translate(1.4, 5.4)">
      <path d="M57.9 71.3 A 29 29 0 1 1 75.3 53.9" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M48 44 L60.0 32.0" stroke="#FF9E6B" stroke-width="10"/>
      <circle cx="48" cy="44" r="5.5" fill="#FFFFFF" stroke="none"/>
      <path d="M62.1 58.1 L78.5 74.5" stroke="#FFFFFF" stroke-width="12"/>
    </g>
  </g>
</svg>

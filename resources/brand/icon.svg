<!--
  데일리Q 앱 아이콘 원본 (512x512) — scripts/gen-brand-assets.cjs 가 이 파일을 읽어
  build/icon.png(512) 와 build/icon.ico(16~256 7종) 를 만든다. 손으로 png/ico 를 만들지 말 것.

  구성 = 잉크네이비 둥근사각 + 흰 마크 + 신호주황 바늘.
  마크 배치 = translate(86,84) scale(3.6) — 100 격자의 실제 내용(약 10.5~84)을
  512 캔버스 정중앙(256,256)에 맞춘 값. 마크 폭은 캔버스의 약 52%(아이콘 안전영역).

  바탕의 그라데이션은 아주 얕게만 준다(#1B3560 → #0F1E38). 평평한 단색은 작업표시줄에서
  죽어 보이고, 진한 그라데이션은 축소 시 탁해진다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3560"/>
      <stop offset="1" stop-color="#0F1E38"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <g transform="translate(86, 84) scale(3.6)" fill="none" stroke-linecap="round">
    <path d="M57.9 71.3 A 29 29 0 1 1 75.3 53.9" stroke="#FFFFFF" stroke-width="9"/>
    <g stroke="#FFFFFF" stroke-width="4">
      <path d="M48 26 V31"/>
      <path d="M31.1 37.8 L35.8 39.6"/>
      <path d="M64.9 37.8 L60.2 39.6"/>
    </g>
    <path d="M48 44 L59.3 32.7" stroke="#FF9E6B" stroke-width="7"/>
    <circle cx="48" cy="44" r="4.5" fill="#FFFFFF" stroke="none"/>
    <path d="M62.1 58.1 L77.7 73.7" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>

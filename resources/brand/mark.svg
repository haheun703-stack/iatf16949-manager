<!--
  데일리Q 마크 (시안 C 게이지Q · 사장님 결정 2026-08-25)

  형태 = 계측기 다이얼. 베젤 우하단에 틈이 있고 그 틈으로 꼬리가 빠져나와 Q 가 된다.
  중심 (48,44) · 반지름 29 · 틈은 45도 중심(20도~70도).
  translate 는 내용의 시각 중심을 (50,50) 에 맞추기 위한 보정.

  색 = currentColor 가 아니라 CSS 변수로 받는다(--m-ink / --m-sig).
  변수가 없을 때 폴백 = 잉크네이비 #152A4A · 신호주황 #D2542A.
  어두운 바탕에서는 부르는 쪽이 --m-ink:#fff · --m-sig:#FF9E6B 로 덮어쓴다.

  ⚠ 16px 이하로 줄일 때는 이 파일이 아니라 mark-simple.svg 를 쓸 것(눈금이 뭉친다).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="데일리Q">
  <g transform="translate(1.4, 5.4)"
     fill="none"
     stroke-linecap="round">
    <!-- 베젤 — 우하단 45도에 틈 -->
    <path d="M57.9 71.3 A 29 29 0 1 1 75.3 53.9"
          stroke="var(--m-ink, #152A4A)" stroke-width="9"/>
    <!-- 눈금 3 (12시 · 8시 · 4시 방향) -->
    <g stroke="var(--m-ink, #152A4A)" stroke-width="4">
      <path d="M48 26 V31"/>
      <path d="M31.1 37.8 L35.8 39.6"/>
      <path d="M64.9 37.8 L60.2 39.6"/>
    </g>
    <!-- 바늘 -->
    <path d="M48 44 L59.3 32.7" stroke="var(--m-sig, #D2542A)" stroke-width="7"/>
    <!-- 축 -->
    <circle cx="48" cy="44" r="4.5" fill="var(--m-ink, #152A4A)" stroke="none"/>
    <!-- 꼬리 — 베젤 틈으로 빠져나온다 -->
    <path d="M62.1 58.1 L77.7 73.7" stroke="var(--m-ink, #152A4A)" stroke-width="10"/>
  </g>
</svg>
